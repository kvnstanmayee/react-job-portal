apiVersion: apps/v1
kind: Deployment
metadata:
  name: mywebapp-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mywebapp
  template:
    metadata:
      labels:
        app: mywebapp
    spec:
      containers:
        - name: mywebapp
          image: kvnstanmayee/mywebapp:1.0   # <-- change to your Docker Hub image
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000        # must match backend PORT
          env:
            - name: PORT
              value: "4000"
          readinessProbe:
            httpGet:
              path: /
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: mywebapp-service
spec:
  type: NodePort
  selector:
    app: mywebapp
  ports:
    - port: 4000         # cluster port
      targetPort: 4000   # container port
      nodePort: 32000    # NodePort (optional explicit; else K8s picks 30000-32767)
