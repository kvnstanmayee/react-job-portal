name: CI Pipeline – React Job Portal

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    # --- Frontend Build (React + Vite) ---
    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm install

    - name: Build Frontend
      working-directory: ./frontend
      run: npm run build

    # --- Backend Dependencies (Node/Express) ---
    - name: Install Backend Dependencies
      working-directory: ./backend
      run: npm install

    # --- Optional Basic Test Step (simulate) ---
    - name: Simulate Tests
      working-directory: ./backend
      run: echo "✅ Build and install steps succeeded — no tests configured."
