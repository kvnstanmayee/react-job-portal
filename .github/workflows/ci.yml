name: CI/CD Pipeline – React Job Portal

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ----------------------------
  # 1️⃣ BUILD STAGE
  # ----------------------------
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    # Frontend Build
    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm install

    - name: Build Frontend (Vite)
      working-directory: ./frontend
      run: npm run build

    # Backend Installation
    - name: Install Backend Dependencies
      working-directory: ./backend
      run: npm install

    # Docker Build
    - name: Build Docker Image
      run: docker build -t react-job-portal:latest .

  # ----------------------------
  # 2️⃣ TEST STAGE
  # ----------------------------
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Simulate Tests
      run: echo "✅ All automated tests passed successfully."

  # ----------------------------
  # 3️⃣ DEPLOY STAGE
  # ----------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Deploy Application
      run: |
        echo "🚀 Deploying React Job Portal to staging environment..."
        echo "Simulated deployment complete."
